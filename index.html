  <!-- AUDIO SUCCESS / SFX SYNTH (Fallback Web Audio) -->
  <script>
    // Simple Web Audio Sound Effects Generator
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
        osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      } else if (type === 'incorrect') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.setValueAtTime(220, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'pop') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'win') {
        // celebratory chime
        [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.2, now + idx * 0.1);
          g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.4);
          o.start(now + idx * 0.1);
          o.stop(now + idx * 0.1 + 0.4);
        });
      }
    }

    // Native French Speech Synthesis
    function speakFrench(text, forcePlay = false) {
      if (!('speechSynthesis' in window)) {
        console.warn('Speech synthesis not supported');
        return;
      }
      window.speechSynthesis.cancel(); // Stop any currently playing audio
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'fr-FR';
      utterance.rate = 0.85; // Slightly slower for 10-year-olds
      utterance.pitch = 1.05;

      // Try selecting a French voice if present
      const voices = window.speechSynthesis.getVoices();
      const frVoice = voices.find(v => v.lang.startsWith('fr') || v.lang.includes('fr_FR') || v.lang.includes('fra'));
      if (frVoice) {
        utterance.voice = frVoice;
      }
      window.speechSynthesis.speak(utterance);
    }
  </script>

    // LocalStorage State Initializer
    const STORAGE_KEY = 'petit_francais_v1_data';

    const defaultState = {
      xp: 40,
      streak: 1,
      lastActiveDate: new Date().toISOString().split('T')[0],
      unlockedLesson: 1,
      completedLessons: [],
      quizScores: {}, // lessonId: score %
      vocabMastered: [],
      badges: ['first_step'],
      devModeUnlockAll: false
    };

    function loadAppState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          return { ...defaultState, ...JSON.parse(saved) };
        } catch (e) {
          return defaultState;
        }
      }
      return defaultState;
    }

    let state = loadAppState();

    function saveAppState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateNavStats();

      if (!state.badges.includes(badgeId)) {

      document.body.appendChild(toast);

          iconDiv.classList.remove('bg-blue-100');
          iconDiv.classList.add('bg-slate-100');
        }
      });

      const activeTab = document.getElementById(`tab-${viewName}`);
      if (activeTab) {
        activeTab.classList.remove('text-slate-400');
        activeTab.classList.add('text-frenchBlue');
        const iconDiv = activeTab.querySelector('div');
        if (iconDiv) {
          iconDiv.classList.remove('bg-slate-100');
          iconDiv.classList.add('bg-blue-100');
        }
      }

      const viewport = document.getElementById('app-viewport');
      switch (viewName) {
        case 'home':
          renderHome(viewport);
          break;
        case 'map':
          renderLessonMap(viewport);
          break;

          renderVocabBank(viewport);

          startLesson(params.lessonId);

  <!-- LESSON ENGINE (7-STEP MODULAR RUNNER) -->
  <script>
    // LESSON RUNNER STATE MACHINE
    // Steps: 0: Learn, 1: Repeat, 2: Practice, 3: Listening, 4: Speaking, 5: Mini-Game, 6: Mini-Quiz, 7: Celebration
    const LESSON_STEPS = [
      { name: "Learn", icon: "📖" },
      { name: "Repeat", icon: "🗣️" },
      { name: "Practice", icon: "✍️" },
      { name: "Listen", icon: "🎧" },
      { name: "Speak", icon: "🎤" },
      { name: "Game", icon: "🎮" },
      { name: "Quiz", icon: "⭐" }
    ];

    function startLesson(lessonId) {
      const lesson = CURRICULUM.find(l => l.id === Number(lessonId));
      if (!lesson) {
        showToast("Lesson not found!", "red");
        navigate('map');
        return;
      }

      currentLessonSession = {
        lesson: lesson,
        stepIndex: 0,
        subStep: 0,
        quizScore: 0,
        quizAnswers: []
      };

      renderLessonFrame();
    }

    function renderLessonFrame() {
      const viewport = document.getElementById('app-viewport');
      const session = currentLessonSession;
      if (!session) return;

      const currentStep = LESSON_STEPS[session.stepIndex];

      viewport.innerHTML = `
        <div class="max-w-3xl mx-auto space-y-4 animate-pop-in">
          
          <!-- TOP STEP HEADER & PROGRESS BAR -->
          <div class="bg-white rounded-3xl p-4 shadow-sm border-2 border-blue-100 flex items-center justify-between gap-4">
            <button onclick="confirmExitLesson()" class="w-10 h-10 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center font-bold text-lg transition">
              <i class="fa-solid fa-xmark"></i>
            </button>

            <!-- 7-Step Dots -->
            <div class="flex-1 flex items-center justify-between gap-1 max-w-md">
              ${LESSON_STEPS.map((st, idx) => `
                <div class="flex-1 h-3 rounded-full transition-all duration-300 ${
                  idx < session.stepIndex
                    ? 'bg-emerald-500'
                    : idx === session.stepIndex
                    ? 'bg-frenchBlue ring-2 ring-blue-300'
                    : 'bg-slate-200'
                }"></div>
              `).join('')}
            </div>

            <!-- Current Step Icon -->
            <div class="flex items-center gap-1.5 text-xs font-bold text-frenchBlue bg-blue-50 px-3 py-1.5 rounded-2xl">
              <span>${currentStep.icon}</span>
              <span class="hidden sm:inline">${currentStep.name}</span>
            </div>
          </div>

          <!-- DYNAMIC STEP BODY -->
          <div id="lesson-step-content" class="bg-white rounded-3xl p-6 sm:p-8 shadow-md border-3 border-blue-100 min-h-[420px] flex flex-col justify-between">
            <!-- Step content dynamically injected here -->
          </div>

        </div>
      `;

      renderStepContent();
    }

    function renderStepContent() {
      const contentEl = document.getElementById('lesson-step-content');
      if (!contentEl) return;
      const session = currentLessonSession;
      const lesson = session.lesson;

      switch (session.stepIndex) {
        case 0:
          renderStep1Learn(contentEl, lesson);
          break;
        case 1:
          renderStep2Repeat(contentEl, lesson);
          break;
        case 2:
          renderStep3Practice(contentEl, lesson);
          break;
        case 3:
          renderStep4Listening(contentEl, lesson);
          break;
        case 4:
          renderStep5Speaking(contentEl, lesson);
          break;
        case 5:
          renderStep6MiniGame(contentEl, lesson);
          break;
        case 6:
          renderStep7MiniQuiz(contentEl, lesson);
          break;
        case 7:
          renderLessonCelebration(contentEl, lesson);
          break;
      }
    }

    function advanceStep() {
      if (!currentLessonSession) return;
      currentLessonSession.stepIndex++;
      currentLessonSession.subStep = 0;
      renderLessonFrame();
    }

    function confirmExitLesson() {
      openModal(`
        <div class="text-center space-y-4">
          <div class="text-5xl">🥺</div>
          <h3 class="heading-font text-2xl font-bold text-slate-800">Leave Lesson?</h3>
          <p class="text-slate-500 text-sm font-semibold">Your current lesson progress won't be saved if you leave now.</p>
          <div class="flex gap-3 pt-2">
            <button onclick="closeModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-2xl">
              Keep Learning
            </button>
            <button onclick="closeModal(); navigate('home');" class="flex-1 bg-frenchRed hover:bg-red-600 text-white font-bold py-3 rounded-2xl">
              Exit
            </button>
          </div>
        </div>
      `);
    }

    // ----------------------------------------------------
    // STEP 1 — LEARN: VOCABULARY FLASHCARD CAROUSEL
    // ----------------------------------------------------
    function renderStep1Learn(el, lesson) {
      const vocab = lesson.vocabulary;
      const currentWord = vocab[currentLessonSession.subStep] || vocab[0];

      el.innerHTML = `
        <div class="space-y-6 text-center animate-pop-in">
          <div>
            <span class="text-xs font-extrabold text-frenchBlue bg-blue-50 px-3 py-1 rounded-full uppercase tracking-wider">
              Step 1 • Learn Words (${currentLessonSession.subStep + 1} of ${vocab.length})
            </span>
            <h3 class="heading-font text-2xl font-bold text-slate-800 mt-2">Listen & Learn 🌟</h3>
          </div>

          <!-- Big Card -->
          <div class="max-w-sm mx-auto bg-gradient-to-b from-blue-50 to-indigo-50 border-3 border-blue-200 rounded-3xl p-6 shadow-md game-card relative">
            <div class="text-6xl mb-3">${currentWord.icon}</div>
            <h4 class="heading-font text-4xl font-extrabold text-frenchBlue mb-1">${currentWord.french}</h4>
            <p class="text-sm font-extrabold text-blue-400 mb-2">Pronounce: "${currentWord.phonetic}"</p>
            <div class="bg-white/80 rounded-2xl py-2 px-4 inline-block font-bold text-slate-700 text-lg shadow-sm">
              ${currentWord.english}
            </div>
            ${currentWord.hint ? `<p class="text-xs text-slate-400 font-bold mt-3">💡 ${currentWord.hint}</p>` : ''}
          </div>

          <!-- Audio Action Button -->
          <div>
            <button onclick="speakFrench('${currentWord.french}'); playSfx('pop');" class="bg-amber-400 hover:bg-amber-500 text-amber-950 font-extrabold px-6 py-3.5 rounded-2xl text-base shadow-lg shadow-amber-200 transition active:scale-95 inline-flex items-center gap-2.5">
              <i class="fa-solid fa-volume-high text-xl"></i>
              <span>Listen Pronunciation</span>
            </button>
          </div>
        </div>

        <!-- Bottom Controls -->
        <div class="flex justify-between items-center pt-6 border-t border-slate-100">
          <button onclick="prevLearnWord()" class="px-5 py-2.5 rounded-2xl font-bold text-sm bg-slate-100 hover:bg-slate-200 text-slate-600 transition ${currentLessonSession.subStep === 0 ? 'opacity-40 pointer-events-none' : ''}">
            ← Back
          </button>
          <button onclick="nextLearnWord()" class="px-7 py-3 rounded-2xl font-extrabold text-sm bg-frenchBlue hover:bg-blue-700 text-white shadow-md shadow-blue-300 transition active:scale-95 flex items-center gap-2">
            <span>${currentLessonSession.subStep === vocab.length - 1 ? 'Ready to Repeat! 🚀' : 'Next Word →'}</span>
          </button>
        </div>
      `;

      // Auto play audio once on first view
      speakFrench(currentWord.french);
    }

    function nextLearnWord() {
      const vocab = currentLessonSession.lesson.vocabulary;
      if (currentLessonSession.subStep < vocab.length - 1) {
        currentLessonSession.subStep++;
        renderStepContent();
      } else {
        awardXP(10, "Vocabulary learned!");
        advanceStep();
      }
    }

    function prevLearnWord() {
      if (currentLessonSession.subStep > 0) {
        currentLessonSession.subStep--;
        renderStepContent();
      }
    }

    // ----------------------------------------------------
    // STEP 2 — REPEAT: SPEAK IT ALOUD (WITH MIC / AUDIO FALLBACK)
    // ----------------------------------------------------
    function renderStep2Repeat(el, lesson) {
      const vocab = lesson.vocabulary;
      const targetWord = vocab[currentLessonSession.subStep] || vocab[0];

      el.innerHTML = `
        <div class="space-y-6 text-center animate-pop-in">
          <div>
            <span class="text-xs font-extrabold text-purple-600 bg-purple-50 px-3 py-1 rounded-full uppercase tracking-wider">
              Step 2 • Repeat Aloud (${currentLessonSession.subStep + 1} of ${Math.min(4, vocab.length)})
            </span>
            <h3 class="heading-font text-2xl font-bold text-slate-800 mt-2">Say It Loud & Proud! 🗣️</h3>
          </div>

          <div class="max-w-sm mx-auto bg-purple-50 border-3 border-purple-200 rounded-3xl p-6">
            <div class="text-5xl mb-2">${targetWord.icon}</div>
            <h4 class="heading-font text-3xl font-extrabold text-purple-700">${targetWord.french}</h4>
            <p class="text-xs font-bold text-purple-400 mt-1">"${targetWord.phonetic}"</p>
            <p class="text-sm font-semibold text-slate-600 mt-2">Meaning: ${targetWord.english}</p>
          </div>

          <!-- Micro / Practice Feedback Area -->
          <div id="repeat-feedback-box" class="min-h-[50px] flex items-center justify-center">
            <p class="text-sm font-bold text-slate-400">Tap the mic button and say "${targetWord.french}"!</p>
          </div>

          <!-- Controls -->
          <div class="flex justify-center items-center gap-4">
            <button onclick="speakFrench('${targetWord.french}')" class="w-14 h-14 rounded-2xl bg-blue-100 hover:bg-blue-200 text-frenchBlue flex items-center justify-center text-xl transition" title="Listen again">
              <i class="fa-solid fa-volume-high"></i>
            </button>
            <button id="mic-trigger-btn" onclick="startSpeechPractice('${targetWord.french}')" class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-frenchRed to-rose-500 hover:from-red-600 hover:to-rose-600 text-white flex items-center justify-center text-3xl shadow-xl shadow-red-300 transition active:scale-95 animate-bounce-slow">
              <i class="fa-solid fa-microphone"></i>
            </button>
          </div>
        </div>

        <div class="flex justify-end pt-6 border-t border-slate-100">
          <button onclick="nextRepeatWord()" class="px-7 py-3 rounded-2xl font-extrabold text-sm bg-purple-600 hover:bg-purple-700 text-white shadow-md shadow-purple-200 transition active:scale-95">
            Continue →
          </button>
        </div>
      `;
    }

    function startSpeechPractice(expectedWord) {
      const feedback = document.getElementById('repeat-feedback-box');
      const micBtn = document.getElementById('mic-trigger-btn');
      
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        // Friendly Fallback if browser doesn't have Web Speech Recognition
        feedback.innerHTML = `
          <div class="bg-emerald-100 border border-emerald-300 text-emerald-800 px-4 py-2 rounded-2xl text-xs font-bold animate-pop-in">
            🌟 Fantastique! Great job saying it aloud!
          </div>
        `;
        playSfx('correct');
        awardXP(5, "Speaking practice");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'fr-FR';
      recognition.interimResults = false;
      recognition.maxAlternatives = 3;

      if (micBtn) micBtn.classList.add('ring-4', 'ring-red-300', 'animate-pulse');
      feedback.innerHTML = `<span class="text-sm font-bold text-frenchBlue animate-pulse">Listening to your French voice... 🎙️</span>`;

      recognition.onresult = (event) => {
        if (micBtn) micBtn.classList.remove('ring-4', 'ring-red-300', 'animate-pulse');
        const transcript = event.results[0][0].transcript.toLowerCase();
        const expected = expectedWord.toLowerCase();

        if (transcript.includes(expected) || expected.includes(transcript)) {
          feedback.innerHTML = `
            <div class="bg-emerald-100 border border-emerald-300 text-emerald-800 px-4 py-2 rounded-2xl text-xs font-bold animate-pop-in">
              🌟 Très bien! You pronounced "${expectedWord}" perfectly!
            </div>
          `;
          playSfx('correct');
          awardXP(10, "Great pronunciation!");
        } else {
          feedback.innerHTML = `
            <div class="bg-amber-100 border border-amber-300 text-amber-800 px-4 py-2 rounded-2xl text-xs font-bold animate-pop-in">
              😊 Good try! We heard "${transcript}". Let's say "${expectedWord}" together!
            </div>
          `;
          playSfx('pop');
        }
      };

      recognition.onerror = () => {
        if (micBtn) micBtn.classList.remove('ring-4', 'ring-red-300', 'animate-pulse');
        feedback.innerHTML = `
          <div class="bg-emerald-100 border border-emerald-300 text-emerald-800 px-4 py-2 rounded-2xl text-xs font-bold animate-pop-in">
            🌟 Good practice! Keep saying it loud and clear!
          </div>
        `;
        playSfx('correct');
      };

      recognition.start();
    }

    function nextRepeatWord() {
      const vocab = currentLessonSession.lesson.vocabulary;
      const maxSub = Math.min(3, vocab.length - 1);
      if (currentLessonSession.subStep < maxSub) {
        currentLessonSession.subStep++;
        renderStepContent();
      } else {
        advanceStep();
      }
    }

    // ----------------------------------------------------
    // STEP 3 — PRACTICE: MULTIPLE CHOICE, MATCHING, SENTENCE BUILDER
    // ----------------------------------------------------
    function renderStep3Practice(el, lesson) {
      const activities = lesson.practiceActivities || [];
      const currentAct = activities[currentLessonSession.subStep] || activities[0];

      el.innerHTML = `
        <div class="space-y-6 animate-pop-in">
          <div>
            <span class="text-xs font-extrabold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full uppercase tracking-wider">
              Step 3 • Practice (${currentLessonSession.subStep + 1} of ${activities.length})
            </span>
            <h3 class="heading-font text-2xl font-bold text-slate-800 mt-2">Fun Activity Time ✍️</h3>
          </div>

          <div id="practice-activity-arena">
            <!-- Dynamic Practice Type -->
          </div>

          <div id="practice-feedback-area" class="min-h-[40px]"></div>
        </div>
      `;

      const arena = document.getElementById('practice-activity-arena');
      if (currentAct.type === 'choice') {
        renderChoiceActivity(arena, currentAct);
      } else if (currentAct.type === 'match') {
        renderMatchingActivity(arena, currentAct);
      } else if (currentAct.type === 'order') {
        renderSentenceOrderingActivity(arena, currentAct);
      } else if (currentAct.type === 'fill') {
        renderFillInBlankActivity(arena, currentAct);
      }
    }

    function renderChoiceActivity(container, act) {
      container.innerHTML = `
        <div class="space-y-4">
          <div class="bg-blue-50 p-4 rounded-2xl border-2 border-blue-200">
            <h4 class="heading-font text-xl font-bold text-slate-800">${act.question}</h4>
            ${act.helper ? `<p class="text-xs font-semibold text-slate-500 mt-1">💡 Hint: ${act.helper}</p>` : ''}
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${act.options.map((opt, idx) => `
              <button onclick="handleChoiceAnswer(${idx}, ${act.answer})" class="practice-opt-btn p-4 rounded-2xl border-2 border-slate-200 font-extrabold text-slate-700 hover:border-blue-400 hover:bg-blue-50/50 transition text-left flex items-center justify-between">
                <span>${opt}</span>
                <span class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-xs text-slate-400 font-bold">${String.fromCharCode(65 + idx)}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function handleChoiceAnswer(selectedIdx, correctIdx) {
      const feedback = document.getElementById('practice-feedback-area');
      if (selectedIdx === correctIdx) {
        playSfx('correct');
        awardXP(10, "Correct practice answer");
        feedback.innerHTML = `
          <div class="bg-emerald-100 text-emerald-800 p-3 rounded-2xl font-bold text-sm flex items-center justify-between animate-pop-in">
            <span>🎉 Excellent! That is correct!</span>
            <button onclick="nextPracticeActivity()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded-xl font-extrabold">Next →</button>
          </div>
        `;
      } else {
        playSfx('incorrect');
        feedback.innerHTML = `
          <div class="bg-amber-100 text-amber-800 p-3 rounded-2xl font-bold text-sm animate-pop-in">
            😊 Almost! Give it another try!
          </div>
        `;
      }
    }

    function renderMatchingActivity(container, act) {
      let selectedLeft = null;
      let matchedCount = 0;
      const pairs = act.pairs;

      const frWords = [...pairs.map(p => p.fr)].sort(() => Math.random() - 0.5);
      const enWords = [...pairs.map(p => p.en)].sort(() => Math.random() - 0.5);

      container.innerHTML = `
        <div class="space-y-4">
          <p class="text-sm font-bold text-slate-600">Match the French words on the left with their English meanings!</p>
          <div class="grid grid-cols-2 gap-4">
            <div id="match-col-left" class="space-y-2">
              ${frWords.map(w => `

          btn.classList.add('ring-4', 'ring-blue-400');
          selectedLeft = btn;
        } else if (side === 'right' && selectedLeft) {
          const frWord = selectedLeft.getAttribute('data-word');
          const enWord = btn.getAttribute('data-word');
          const pair = pairs.find(p => p.fr === frWord && p.en === enWord);

          if (pair) {
            playSfx('correct');
            selectedLeft.classList.remove('ring-4', 'ring-blue-400');
            selectedLeft.classList.add('bg-emerald-100', 'border-emerald-400', 'text-emerald-700', 'pointer-events-none');

    function finishLessonQuiz(lesson) {

      // Save progress to state
      if (!state.completedLessons.includes(lesson.id)) {
        state.completedLessons.push(lesson.id);
      }
      if (state.unlockedLesson <= lesson.id && lesson.id < 30) {
        state.unlockedLesson = lesson.id + 1;
      }
      state.quizScores[lesson.id] = accuracy;
      
      // Add vocabulary to mastered
      lesson.vocabulary.forEach(v => {
        if (!state.vocabMastered.includes(v.french)) {
          state.vocabMastered.push(v.french);
        }
      });

      // Unlock lesson badge
      if (lesson.badge) {
        unlockBadge(lesson.badge.id);

      if (accuracy === 100) {
        unlockBadge('perfect_quiz');

      awardXP(50, `Completed Lesson ${lesson.id}!`);
      saveAppState();

      // Confetti & SFX celebration

      confetti({ particleCount: 120, spread: 80, origin: { y: 0.5 } });

      renderLessonCelebration(document.getElementById('lesson-step-content'), lesson, score, total, accuracy);

  <!-- STANDALONE GAMES ENGINE (MEMORY MATCH & CATCHER) -->
  <script>
    // 1. REUSABLE MEMORY GAME
    function initMemoryGameInContainer(container, vocabList, onCompleteCallback) {
      const cards = [];
      vocabList.forEach(item => {
        cards.push({ id: item.french, label: item.french, isFr: true, phonetic: item.phonetic });
        cards.push({ id: item.french, label: item.english, isFr: false });
      });
      cards.sort(() => Math.random() - 0.5);

      let flippedCards = [];
      let matchedPairs = 0;

      container.innerHTML = `
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
          ${cards.map((card, idx) => `
            <div data-idx="${idx}" class="mem-card h-24 rounded-2xl bg-blue-100 border-2 border-blue-300 flex items-center justify-center text-center p-2 cursor-pointer font-bold text-sm text-slate-700 hover:bg-blue-200 transition select-none">
              <span class="hidden mem-text">${card.label}</span>
              <span class="mem-back text-2xl">🥐</span>
            </div>
          `).join('')}
        </div>
      `;

      const cardEls = container.querySelectorAll('.mem-card');
      cardEls.forEach(cardEl => {
        cardEl.addEventListener('click', () => {
          const idx = cardEl.getAttribute('data-idx');
          const cardData = cards[idx];

          if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched') || flippedCards.length === 2) {
            return;
          }

          playSfx('pop');
          cardEl.classList.add('flipped', 'bg-white', 'border-frenchBlue');
          cardEl.querySelector('.mem-text').classList.remove('hidden');
          cardEl.querySelector('.mem-back').classList.add('hidden');

          if (cardData.isFr) {
            speakFrench(cardData.label);
          }

          flippedCards.push({ el: cardEl, data: cardData });

          if (flippedCards.length === 2) {
            const [first, second] = flippedCards;
            if (first.data.id === second.data.id && first.data.isFr !== second.data.isFr) {
              // Match!
              playSfx('correct');
              first.el.classList.add('matched', 'bg-emerald-100', 'border-emerald-400', 'text-emerald-800');
              second.el.classList.add('matched', 'bg-emerald-100', 'border-emerald-400', 'text-emerald-800');
              flippedCards = [];
              matchedPairs++;
              if (matchedPairs === vocabList.length) {
                if (onCompleteCallback) onCompleteCallback();
              }
            } else {
              // No match
              playSfx('incorrect');
              setTimeout(() => {
                first.el.classList.remove('flipped', 'bg-white', 'border-frenchBlue');
                first.el.querySelector('.mem-text').classList.add('hidden');
                first.el.querySelector('.mem-back').classList.remove('hidden');

                second.el.classList.remove('flipped', 'bg-white', 'border-frenchBlue');
                second.el.querySelector('.mem-text').classList.add('hidden');
                second.el.querySelector('.mem-back').classList.remove('hidden');
                flippedCards = [];
              }, 900);
            }
          }
        });
      });
    }

    function startStandaloneMemoryGame() {
      const arena = document.getElementById('game-active-arena');
      if (!arena) return;
      const vocab = CURRICULUM[0].vocabulary.concat(CURRICULUM[1].vocabulary).slice(0, 4);

          </div>
          <div id="standalone-memory-slot"></div>
        </div>
      `;

      initMemoryGameInContainer(document.getElementById('standalone-memory-slot'), vocab, () => {
        playSfx('win');
        unlockBadge('game_master');
        awardXP(25, "Memory Match Victory!");
        confetti({ particleCount: 80, spread: 60 });
        showToast("🌟 Game Victory! +25 XP", "purple");
      });
    }

    // 2. REUSABLE WORD BUBBLE CATCHER
    function startStandaloneCatcherGame() {
      const arena = document.getElementById('game-active-arena');
      if (!arena) return;

      const words = [
        { fr: "Bonjour", en: "Hello" },
        { fr: "Merci", en: "Thank you" },
        { fr: "Bleu", en: "Blue" },
        { fr: "Rouge", en: "Red" },
        { fr: "Un", en: "1" },
        { fr: "Dix", en: "10" }
      ];

      let target = words[Math.floor(Math.random() * words.length)];
      let score = 0;

      arena.innerHTML = `
        <div class="bg-white rounded-3xl p-6 border-3 border-pink-200 shadow-lg animate-pop-in space-y-4">
          <div class="flex justify-between items-center">
            <div>
              <h3 class="heading-font text-2xl font-bold text-pink-900">🎈 Word Catcher</h3>
              <p class="text-xs font-bold text-pink-500">Tap the bubble that matches the target word!</p>
            </div>
            <span class="heading-font text-xl font-bold text-pink-600">Score: <span id="catcher-score">0</span>/5</span>
          </div>

          <div class="bg-pink-50 p-4 rounded-2xl text-center border-2 border-pink-200">
            <span class="text-xs font-bold text-pink-400 uppercase">Find the French word for:</span>
            <h4 id="catcher-target-prompt" class="heading-font text-3xl font-extrabold text-pink-700">${target.en}</h4>
          </div>

          <div id="catcher-bubbles" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <!-- Dynamic Bubble Options -->
          </div>
        </div>
      `;

      function nextRound() {
        if (score >= 5) {
          playSfx('win');
          awardXP(30, "Word Catcher Master!");
          confetti({ particleCount: 90 });
          arena.innerHTML = `
            <div class="bg-emerald-50 rounded-3xl p-6 border-3 border-emerald-300 text-center space-y-3">
              <span class="text-5xl">🏆</span>
              <h3 class="heading-font text-2xl font-bold text-emerald-900">You Won Word Catcher!</h3>
              <p class="text-emerald-700 text-sm font-semibold">+30 XP Awarded!</p>
              <button onclick="document.getElementById('game-active-arena').innerHTML=''" class="bg-emerald-600 text-white font-bold px-6 py-2.5 rounded-2xl text-sm">Close Arcade</button>
            </div>
          `;
          return;
        }

        target = words[Math.floor(Math.random() * words.length)];
        document.getElementById('catcher-target-prompt').innerText = target.en;
        document.getElementById('catcher-score').innerText = score;

        const shuffled = [...words].sort(() => Math.random() - 0.5);
        const bubbleContainer = document.getElementById('catcher-bubbles');
        bubbleContainer.innerHTML = shuffled.map(w => `
          <button data-fr="${w.fr}" class="bubble-btn p-4 rounded-3xl bg-white border-3 border-pink-200 hover:border-pink-500 font-extrabold text-slate-700 text-lg shadow-sm hover:scale-105 transition flex items-center justify-center gap-2">
            <span>🎈</span> <span>${w.fr}</span>
          </button>
        `).join('');

        bubbleContainer.querySelectorAll('.bubble-btn').forEach(btn => {
          btn.onclick = () => {
            if (btn.getAttribute('data-fr') === target.fr) {
              playSfx('correct');
              speakFrench(target.fr);
              score++;
              nextRound();
            } else {
              playSfx('incorrect');
              btn.classList.add('bg-red-100');
              setTimeout(() => btn.classList.remove('bg-red-100'), 400);
            }
          };
        });
      }

      nextRound();
    }
  </script>

  <!-- PARENT / TEACHER AREA & MODAL CONTROLS -->
  <script>
    function openModal(contentHtml) {
      const container = document.getElementById('modal-container');
      const card = document.getElementById('modal-card');
      card.innerHTML = contentHtml;
      container.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-container').classList.add('hidden');
    }

    function openParentModal() {
      const totalWords = state.vocabMastered.length;
      const completedCount = state.completedLessons.length;
      
      const scores = Object.values(state.quizScores);
      const avgScore = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between border-b pb-3">
            <div class="flex items-center gap-2">
              <span class="text-2xl">👨‍👩‍👧‍👦</span>
              <h3 class="heading-font text-2xl font-bold text-slate-800">Parent & Teacher Zone</h3>
            </div>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold">✕</button>
          </div>

          <p class="text-xs text-slate-500 font-medium">
            This application stores all learner progress 100% locally in your browser. No personal data, email, or advertising trackers are used.
          </p>

          <!-- Metrics summary -->
          <div class="grid grid-cols-2 gap-3 text-center">
            <div class="bg-blue-50 p-3 rounded-2xl border border-blue-200">
              <span class="text-xs font-bold text-blue-500">Lessons Completed</span>
              <h4 class="heading-font text-2xl font-bold text-blue-800">${completedCount} / 5</h4>
            </div>
            <div class="bg-emerald-50 p-3 rounded-2xl border border-emerald-200">
              <span class="text-xs font-bold text-emerald-600">Words Learned</span>
              <h4 class="heading-font text-2xl font-bold text-emerald-800">${totalWords}</h4>
            </div>
            <div class="bg-amber-50 p-3 rounded-2xl border border-amber-200">
              <span class="text-xs font-bold text-amber-600">Average Quiz Score</span>
              <h4 class="heading-font text-2xl font-bold text-amber-800">${avgScore}%</h4>
            </div>
            <div class="bg-purple-50 p-3 rounded-2xl border border-purple-200">
              <span class="text-xs font-bold text-purple-600">Total XP Earned</span>
              <h4 class="heading-font text-2xl font-bold text-softPurple">${state.xp} ⭐</h4>
            </div>
          </div>

          <!-- Quick Actions -->
          <div class="pt-3 flex gap-2">
            <button onclick="resetAllProgress()" class="w-full bg-red-50 hover:bg-red-100 text-frenchRed font-bold text-xs py-3 rounded-2xl border border-red-200 transition">
              Reset Progress
            </button>
            <button onclick="closeModal()" class="w-full bg-frenchBlue hover:bg-blue-700 text-white font-bold text-xs py-3 rounded-2xl transition">
              Done
            </button>
          </div>
        </div>
      `);
    }

    function resetAllProgress() {
      if (confirm("Are you sure you want to reset all progress and stars for this child?")) {
        localStorage.removeItem(STORAGE_KEY);
        state = { ...defaultState };
        saveAppState();
        closeModal();
        navigate('home');
        showToast("Progress has been reset", "blue");
      }
    }

    // INITIAL STARTUP
    window.addEventListener('DOMContentLoaded', () => {
      updateNavStats();
      navigate('home');
    });
  </script>
</body>
</html>
